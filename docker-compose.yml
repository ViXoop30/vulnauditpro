version: '3.8'

services:
  # React + Nginx (Frontend)
  frontend:
    build: .
    ports:
      - "80:80"
    restart: always
    depends_on:
      - backend

  # PHP-FPM (Backend)
  backend:
    image: php:8.2-fpm-alpine
    restart: always
    working_dir: /var/www/html
    volumes:
      - ./api.php:/var/www/html/api.php
    environment:
      - DB_HOST=db
      - DB_NAME=vuln_db
      - DB_USER=root
      - DB_PASS=rootpassword
    depends_on:
      - db
    # Install mysqli extension
    command: /bin/sh -c "docker-php-ext-install mysqli && php-fpm"

  # MySQL (Database)
  db:
    image: mysql:5.7
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: vuln_db
    volumes:
      - db_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    platform: linux/amd64

volumes:
  db_data:
